<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wakii Team Chat</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #101114; color: #e6e6e9;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 14px; border-bottom: 1px solid #232328;
    display: flex; align-items: center; gap: 8px; font-weight: 600;
  }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb96f; }
  header .dot.off { background: #c24040; }
  header small { margin-left: auto; font-weight: 400; color: #8b8b93; }
  #messages { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 88%; padding: 7px 10px; border-radius: 10px; background: #1b1b20; border: 1px solid #26262c; }
  .msg.mine { align-self: flex-end; background: #1d2b22; border-color: #2b4231; }
  .msg .who { font-size: 11px; color: #8fb8f9; margin-bottom: 2px; }
  .msg .who .role { color: #8b8b93; }
  .msg .body { white-space: pre-wrap; word-break: break-word; }
  .msg .time { font-size: 10px; color: #6d6d75; margin-top: 3px; text-align: right; }
  form { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #232328; }
  input#name { width: 90px; background: #17171b; border: 1px solid #2b2b31; color: #e6e6e9; border-radius: 8px; padding: 8px 10px; }
  input#text { flex: 1; background: #17171b; border: 1px solid #2b2b31; color: #e6e6e9; border-radius: 8px; padding: 8px 10px; }
  button { background: #2f6f3f; color: #fff; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .5; }
  #empty { color: #8b8b93; text-align: center; margin-top: 40px; line-height: 1.8; }
  #empty code { background: #1b1b20; padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<header><span class="dot off" id="live"></span> Team Chat <small id="count"></small></header>
<div id="messages"><div id="empty">Chưa có tin nhắn.<br>Captain / workers gửi từ terminal:<br><code>team-chat send "xin chào"</code></div></div>
<form id="form">
  <input id="name" placeholder="tên bạn" />
  <input id="text" placeholder="Nhắn cả team… (Enter)" autocomplete="off" />
  <button id="send">Gửi</button>
</form>
<script>
  var seq = 0, pending = {}
  function call(action, params) {
    return new Promise(function (resolve) {
      var requestId = 'req-' + ++seq
      pending[requestId] = resolve
      window.parent.postMessage({ type: 'orca-panel-action', requestId: requestId, action: action, params: params || {} }, '*')
    })
  }
  window.addEventListener('message', function (event) {
    var d = event.data
    if (!d || d.type !== 'orca-panel-action-result') return
    var r = pending[d.requestId]; if (r) { delete pending[d.requestId]; r(d.result) }
  })

  var messages = document.getElementById('messages'), empty = document.getElementById('empty')
  var nameInput = document.getElementById('name'), countEl = document.getElementById('count')
  var lastLen = -1

  function fmt(ts) {
    var d = new Date(ts)
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2)
  }

  function render(lines) {
    empty.style.display = 'none'
    messages.innerHTML = ''
    lines.forEach(function (l) {
      var m; try { m = JSON.parse(l) } catch (e) { return }
      var el = document.createElement('div')
      el.className = 'msg' + (m.role === 'owner' ? ' mine' : '')
      var who = document.createElement('div'); who.className = 'who'
      who.textContent = m.from
      var role = document.createElement('span'); role.className = 'role'
      role.textContent = ' · ' + m.role + (m.channel && m.channel !== 'general' ? ' · #' + m.channel : '')
      who.appendChild(role)
      var body = document.createElement('div'); body.className = 'body'; body.textContent = m.text
      var time = document.createElement('div'); time.className = 'time'; time.textContent = fmt(m.at)
      el.appendChild(who); el.appendChild(body); el.appendChild(time)
      messages.appendChild(el)
    })
    messages.scrollTop = messages.scrollHeight
    countEl.textContent = lines.length + ' tin'
  }

  function poll() {
    call('storage.get', { key: 'team.chat.tail' }).then(function (r) {
      var v = r && r.ok !== false && r.value
      var lines = (v && v.value !== undefined ? v.value : v) || []
      document.getElementById('live').classList.remove('off')
      if (lines.length !== lastLen) { lastLen = lines.length; if (lines.length) render(lines) }
      setTimeout(poll, 2000)
    }).catch(function () {
      document.getElementById('live').classList.add('off')
      setTimeout(poll, 4000)
    })
  }

  // Single-slot serializer: tin kế chỉ ghi khi tin trước được worker pick (≤2.5s).
  var sendChain = Promise.resolve()
  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault()
    var text = document.getElementById('text').value.trim()
    if (!text) return
    var from = (nameInput.value || 'owner').trim().slice(0, 40)
    document.getElementById('text').value = ''
    document.getElementById('send').disabled = true
    sendChain = sendChain
      .then(function () {
        return call('storage.set', {
          key: 'team.chat.send',
          value: { at: Date.now(), from: from, role: 'owner', channel: 'general', text: text }
        })
      })
      .then(function () { return new Promise(function (res) { setTimeout(res, 2500) }) })
      .then(function () {
        document.getElementById('send').disabled = false
        document.getElementById('text').focus()
      })
  })

  nameInput.value = localStorage.getItem('teamchat.name') || ''
  nameInput.addEventListener('change', function () { localStorage.setItem('teamchat.name', nameInput.value) })
  poll()
</script>
</body>
</html>
