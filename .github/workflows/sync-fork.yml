name: Sync fork with upstream

# main = PURE MIRROR of stablyai/orca main (policy A, owner call 2026-09-19):
# force-align thay vì ff-only — mọi commit fork trên main bị đè (releases cut
# từ wakii-dev, không từ main). Trước đây ff-only im lặng no-op khi diverge,
# để main kẹt 1.139 commits.

on:
  schedule:
    - cron: "13 17 * * *" # 00:13 giờ VN hằng ngày (17:13 UTC) — 12h đêm
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Force-align main to upstream/main
        run: |
          git remote add upstream https://github.com/stablyai/orca.git
          git fetch upstream main
          BEHIND=$(git rev-list --count main..upstream/main)
          AHEAD=$(git rev-list --count upstream/main..main)
          echo "main vs upstream/main: behind=$BEHIND ahead=$AHEAD"
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date."
            exit 0
          fi
          if [ "$AHEAD" -gt 0 ]; then
            echo "::warning::main có $AHEAD commit riêng — sẽ bị ĐÈ theo policy mirror thuần."
          fi
          git push origin upstream/main:main --force
          echo "synced: main force-aligned to upstream/main ($BEHIND commits)"
