<svg width="840" height="260" viewBox="0 0 840 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="how the crew ships">
  <defs>
    <linearGradient id="pbg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#140b26"/>
    </linearGradient>
    <linearGradient id="pline2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D28D9"/><stop offset="0.5" stop-color="#f0abfc"/><stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="pglow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="836" height="256" rx="14" fill="url(#pbg2)" stroke="#7c6cf055" stroke-width="1.5"/>
  <text x="26" y="40" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#f0abfc" filter="url(#pglow2)">▸ HOW THE CREW SHIPS</text>
  <text x="814" y="40" text-anchor="end" font-family="Menlo, monospace" font-size="11" fill="#475569">one idea in · one PR out</text>

  <path id="flow2" d="M 60 122 H 780" stroke="#7c6cf033" stroke-width="3" fill="none"/>

  <circle r="6" fill="#f0abfc" filter="url(#pglow2)">
    <animateMotion dur="3.2s" repeatCount="indefinite">
      <mpath href="#flow2"/>
    </animateMotion>
  </circle>

  <g font-family="Menlo, monospace" text-anchor="middle">
    <g>
      <rect x="22" y="92" width="86" height="60" rx="10" fill="#111834" stroke="#7c6cf066"/>
      <text x="65" y="119" font-size="18">💡</text>
      <text x="65" y="140" font-size="11" fill="#e2e8f0">idea</text>
    </g>
    <g>
      <rect x="146" y="92" width="86" height="60" rx="10" fill="#111834" stroke="#7c6cf066"/>
      <text x="189" y="119" font-size="18">🧭</text>
      <text x="189" y="140" font-size="11" fill="#e2e8f0">impact</text>
      <text x="189" y="164" font-size="9.5" fill="#64748b">phase0-analyst</text>
    </g>
    <g>
      <rect x="270" y="92" width="86" height="60" rx="10" fill="#111834" stroke="#7c6cf066"/>
      <text x="313" y="119" font-size="18">🗺️</text>
      <text x="313" y="140" font-size="11" fill="#e2e8f0">plan</text>
      <text x="313" y="164" font-size="9.5" fill="#64748b">plan-critic</text>
    </g>
    <g>
      <rect x="394" y="92" width="86" height="60" rx="10" fill="#111834" stroke="#7c6cf066"/>
      <text x="437" y="119" font-size="18">📋</text>
      <text x="437" y="140" font-size="11" fill="#e2e8f0">bracket</text>
      <text x="437" y="164" font-size="9.5" fill="#64748b">spec-critic</text>
    </g>
    <g>
      <rect x="518" y="92" width="86" height="60" rx="10" fill="#111834" stroke="#34d39966"/>
      <text x="561" y="116" font-size="14">⚙️⚙️⚙️</text>
      <text x="561" y="140" font-size="11" fill="#e2e8f0">parallel SFs</text>
      <text x="561" y="164" font-size="9.5" fill="#64748b">executor + reviewer</text>
    </g>
    <g>
      <rect x="642" y="92" width="86" height="60" rx="10" fill="#111834" stroke="#fbbf2466"/>
      <text x="685" y="119" font-size="18">🚦</text>
      <text x="685" y="140" font-size="11" fill="#e2e8f0">gates</text>
      <text x="685" y="164" font-size="9.5" fill="#64748b">verifier + audit</text>
    </g>
    <g>
      <rect x="766" y="92" width="58" height="60" rx="10" fill="#111834" stroke="#34d39966"/>
      <text x="795" y="119" font-size="18">🚢</text>
      <text x="795" y="140" font-size="11" fill="#e2e8f0">PR</text>
    </g>
  </g>

  <!-- gates: B0..B5 đèn nhấp dồn -->
  <g font-family="Menlo, monospace" font-size="10">
    <rect x="646" y="176" width="32" height="16" rx="8" fill="#1e293b"/>
    <circle cx="656" cy="184" r="3.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="0s" repeatCount="indefinite"/></circle>
    <text x="668" y="188" fill="#22c55e">B1</text>
    <rect x="682" y="176" width="32" height="16" rx="8" fill="#1e293b"/>
    <circle cx="692" cy="184" r="3.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <text x="704" y="188" fill="#22c55e">B2</text>
    <rect x="718" y="176" width="32" height="16" rx="8" fill="#1e293b"/>
    <circle cx="728" cy="184" r="3.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></circle>
    <text x="740" y="188" fill="#22c55e">B3</text>
    <rect x="754" y="176" width="32" height="16" rx="8" fill="#1e293b"/>
    <circle cx="764" cy="184" r="3.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="0.9s" repeatCount="indefinite"/></circle>
    <text x="776" y="188" fill="#22c55e">B4</text>
    <rect x="646" y="198" width="32" height="16" rx="8" fill="#1e293b"/>
    <circle cx="656" cy="206" r="3.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></circle>
    <text x="668" y="210" fill="#22c55e">B5</text>
    <rect x="682" y="198" width="32" height="16" rx="8" fill="#1e293b"/>
    <circle cx="692" cy="206" r="3.5" fill="#a78bfa"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <text x="704" y="210" fill="#a78bfa">B0</text>
  </g>

  <text x="420" y="236" text-anchor="middle" font-family="Menlo, monospace" font-size="11.5" fill="#7dd3fc">
    gates are adversarial by design — <tspan fill="#f0abfc">self-approve isn't a gate</tspan>
  </text>
</svg>
