<svg width="840" height="330" viewBox="0 0 840 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="skills catalog chips">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#140b26"/>
    </linearGradient>
    <linearGradient id="sscan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0abfc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f0abfc" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="sglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="836" height="326" rx="14" fill="url(#sbg)" stroke="#7c6cf055" stroke-width="1.5"/>
  <text x="26" y="40" font-family="Menlo, monospace" font-size="15" font-weight="700" fill="#67e8f9" filter="url(#sglow)">▸ THE CATALOG — /command to invoke</text>
  <text x="814" y="40" text-anchor="end" font-family="Menlo, monospace" font-size="11" fill="#475569">13 public · 20 in the box</text>

