<style>
  /* Tokens copy nguyên giá trị từ src/renderer/src/assets/main.css — không màu mới */
  :root{
    --background:#0a0a0a; --editor-surface:#1e1e1e; --card:#171717; --card-foreground:#fafafa;
    --foreground:#fafafa; --muted:#262626; --muted-foreground:#a1a1a1; --accent:#404040;

    --font-mono:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;

  body.light{
    --background:#fff; --editor-surface:#fff; --card:#fff; --card-foreground:#0a0a0a;
    --foreground:#0a0a0a; --muted:#f5f5f5; --muted-foreground:#737373; --accent:#f5f5f5;
    --accent-foreground:#171717; --border:#e5e5e5; --ring:#a1a1a1;
    --primary:#171717; --primary-foreground:#fafafa; --popover:#fff;
    --destructive:#e40014; --status-success:#15803d;
  }
  html,body{height:100%}
  body{margin:0;background:var(--background);color:var(--foreground);font:14px/1.45 var(--font-sans);letter-spacing:.01em;overflow:hidden}
  button{font-family:var(--font-sans)}
  #app{display:flex;flex-direction:column;height:100%}

  /* Tab giả — viewer sống trong editor tab floating workspace */
  #tabbar{height:38px;flex:none;display:flex;align-items:flex-end;gap:2px;padding:0 12px;background:var(--background);border-bottom:1px solid var(--border)}
  .tab{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:8px 8px 0 0;font-size:12px;color:var(--muted-foreground)}
  .tab.active{background:var(--editor-surface);color:var(--foreground);border:1px solid var(--border);border-bottom:none;margin-bottom:-1px}
  .tab .mono{font-family:var(--font-mono);font-size:11.5px}

  #toolbar{height:46px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--editor-surface);border-bottom:1px solid var(--border)}
  .seg{display:flex;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:2px}
  .seg button{border:0;background:transparent;color:var(--muted-foreground);font-size:12px;font-weight:600;padding:5px 12px;border-radius:7px;cursor:pointer}
  .seg button.on{background:var(--accent);color:var(--accent-foreground)}
  .chips{display:flex;gap:4px;align-items:center}
  .chip{border:1px solid var(--border);background:transparent;color:var(--muted-foreground);font-size:11px;font-weight:500;padding:4px 9px;border-radius:999px;cursor:pointer}
  .chip.on{color:var(--foreground);background:var(--muted)}
  .chip:disabled{opacity:.32;cursor:default}
  .spacer{flex:1}
  .tbtn{height:28px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted-foreground);font-size:11.5px;font-weight:500;cursor:pointer}
  .tbtn:hover{background:var(--accent);color:var(--accent-foreground)}
  .tbtn.on{color:var(--foreground);background:var(--muted)}
  .tbtn svg{width:13px;height:13px}
  #warnchip{display:flex;color:var(--workspace-status-progress);border-color:color-mix(in srgb,var(--workspace-status-progress) 35%,transparent)}

  #main{flex:1;display:flex;min-height:0}
  #canvas{position:relative;flex:1;overflow:hidden;background:var(--editor-surface);cursor:grab}
  #canvas.panning{cursor:grabbing}
  #viewport{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
  #nodelayer{position:absolute;left:0;top:0}

  .edge{fill:none;stroke:var(--muted-foreground);stroke-width:1.2;opacity:.4;transition:opacity .12s}
  .e-depends-on{stroke-dasharray:5 4;stroke-width:1.4;opacity:.65}
  .e-flows-to{stroke-width:1.6;opacity:.75}
  .e-impacts{stroke-dasharray:2 4;opacity:.4}
  .e-writes{stroke-dasharray:6 3;opacity:.4}
  .edge.faint{opacity:.14}
  .edge.dim{opacity:.05}
  .edge.hot{opacity:1;stroke:var(--foreground)}

  .node{position:absolute;box-sizing:border-box;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:7px 10px;cursor:pointer;user-select:none;transition:opacity .12s,border-color .12s,box-shadow .12s}
  .node:hover{border-color:var(--ring)}
  .node.dim{opacity:.15}
  .node.hidden{display:none}
  .node.sel{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 32%,transparent)}
  .kind-epic{border-width:1.5px;border-color:color-mix(in srgb,var(--foreground) 25%,var(--border))}
  .kind-step{border-radius:999px}
  .kind-area{border-radius:999px;background:transparent;border-style:dashed}
  .kind-file{background:var(--editor-surface)}
  .kind-file.computed{border-style:dashed}
  .nrow{display:flex;align-items:center;gap:6px;min-width:0}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .tag{font-family:var(--font-mono);font-size:9px;font-weight:600;line-height:1;letter-spacing:.08em;color:var(--muted-foreground);border:1px solid var(--border);border-radius:4px;padding:2px 4px;flex:none}
  .ntitle{font-size:12.5px;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .nmeta{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nbar{height:3px;border-radius:2px;background:var(--muted);margin-top:6px;overflow:hidden}
  .nbar i{display:block;height:100%;background:var(--status-success)}

  #legend{position:absolute;right:14px;bottom:14px;background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--muted-foreground);display:grid;grid-template-columns:auto auto;gap:5px 18px;pointer-events:none;backdrop-filter:blur(4px)}
  .lg{display:flex;align-items:center;gap:6px}
  .lg .dot{width:7px;height:7px}
  .lgsample{width:22px;height:0;border-top:1.5px solid var(--muted-foreground);opacity:.6}
  .lg.dash .lgsample{border-top-style:dashed}
  .lg.dotd .lgsample{border-top-style:dotted}

  #hint{position:absolute;left:14px;bottom:14px;font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground);opacity:.7;pointer-events:none}

  #panel{position:absolute;top:14px;right:14px;width:300px;max-height:calc(100% - 28px);overflow:auto;background:var(--popover);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-floating);padding:14px;display:none;cursor:default}
  #panel.show{display:block}
  .p-head{display:flex;align-items:center;justify-content:space-between}
  .p-kind{font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-foreground);border:1px solid var(--border);border-radius:4px;padding:3px 6px}
  .p-close{border:0;background:transparent;color:var(--muted-foreground);cursor:pointer;padding:4px;border-radius:6px;display:flex}
  .p-close:hover{background:var(--accent);color:var(--accent-foreground)}
  .p-title{font-size:14px;font-weight:600;line-height:1.35;margin:8px 0 10px;word-break:break-word}
  .p-state{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;border:1px solid}
  .p-row{display:flex;gap:8px;font-size:12px;margin-top:9px;align-items:baseline}
  .p-row .k{flex:none;width:70px;color:var(--muted-foreground);font-size:11px}
  .p-row .v{min-width:0;word-break:break-word}
  .p-row .v.mono{font-family:var(--font-mono);font-size:11.5px}
  .p-ev{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}
  .p-evh{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground);margin-bottom:8px}
  .p-evi{font-size:12px;margin-bottom:9px;line-height:1.4}
  .p-evr{font-family:var(--font-mono);font-size:10.5px;color:var(--muted-foreground);margin-top:2px;word-break:break-all}

  #warnbox div{margin:3px 0}

  #errbox{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--background) 72%,transparent);backdrop-filter:blur(3px)}
  #errbox.show{display:flex}
  .errcard{width:440px;background:var(--popover);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-floating);padding:22px}
  .erricon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--destructive) 14%,transparent);color:var(--destructive);margin-bottom:12px}
  .erricon svg{width:18px;height:18px}
  .errh{font-size:15px;font-weight:600}
  .errcode{display:inline-block;margin-top:8px;font-family:var(--font-mono);font-size:10.5px;color:var(--destructive);border:1px solid color-mix(in srgb,var(--destructive) 35%,transparent);background:color-mix(in srgb,var(--destructive) 10%,transparent);border-radius:4px;padding:2px 6px}
  .errmsg{font-size:13px;margin-top:8px}
  .errpath{font-family:var(--font-mono);font-size:11.5px;color:var(--muted-foreground);margin-top:10px;background:var(--muted);border-radius:8px;padding:8px 10px;word-break:break-all}
  .errhint{font-size:11.5px;color:var(--muted-foreground);margin-top:10px}
  .erractions{display:flex;justify-content:flex-end;margin-top:14px}
</style>

const ERROR_PAYLOAD = { code:'schema', message:'Thiếu trường bắt buộc "wakiiMindmap" (magic + schema version) — decoder từ chối file.', path: PAYLOAD.path };

/* ── Map token: state → màu (chỉ token main.css) ── */
const KIND = { epic:{label:'Epic'}, sf:{label:'SF'}, task:{label:'Task'}, step:{label:'Bước'}, area:{label:'Area'}, file:{label:'File'} };
const STATE = {
  'done':{label:'Hoàn thành', color:'var(--status-success)'},
  'in-progress':{label:'Đang chạy', color:'var(--workspace-status-progress)'},
  'pending':{label:'Chờ', color:'var(--muted-foreground)'},
  'blocked':{label:'Bị chặn', color:'var(--destructive)'},
  'complete':{label:'Hoàn tất', color:'var(--status-success)'}
};

const M = PAYLOAD.mindmap;
const byId = new Map(M.nodes.map(n=>[n.id,n]));
const outEdges = new Map(), inEdges = new Map();
M.edges.forEach(e=>{
  if(!outEdges.has(e.from)) outEdges.set(e.from,[]);
  outEdges.get(e.from).push(e);
  if(!inEdges.has(e.to)) inEdges.set(e.to,[]);
  inEdges.get(e.to).push(e);
});
const children = id => M.nodes.filter(n=>n.parent===id);
function neighbors(id){
  const s = new Set([id]);
  (outEdges.get(id)||[]).forEach(e=>s.add(e.to));
  (inEdges.get(id)||[]).forEach(e=>s.add(e.from));
  M.nodes.forEach(n=>{ if(n.parent===id) s.add(n.id); });
  const me = byId.get(id); if (me && me.parent) s.add(me.parent);
  s.delete(id); return s;
}
const evidenceFor = id => M.evidence.filter(ev=>ev.node===id);
const sfWrites = id => (inEdges.get(id)||[]).filter(e=>e.rel==='writes').map(e=>byId.get(e.from)).filter(Boolean);

/* ── Camera: pan/zoom ── */
const WORLD = { w:1560, h:940 };
function makeCamera(container, viewportEl, world){
  const st = { x:0, y:0, k:1 };
  const apply = ()=>{ viewportEl.style.transform = 'translate('+st.x+'px,'+st.y+'px) scale('+st.k+')'; };
  function fit(){
    const r = container.getBoundingClientRect(); if (!r.width) return;
    st.k = Math.min(r.width/world.w, r.height/world.h) * 0.93;
    st.x = (r.width - world.w*st.k)/2; st.y = (r.height - world.h*st.k)/2; apply();
  }
  container.addEventListener('wheel', e=>{
    e.preventDefault();
    const r = container.getBoundingClientRect();
    const mx = e.clientX-r.left, my = e.clientY-r.top;
    const k2 = Math.min(2.6, Math.max(0.3, st.k*Math.exp(-e.deltaY*0.0016)));
    st.x = mx-(mx-st.x)*(k2/st.k); st.y = my-(my-st.y)*(k2/st.k); st.k = k2; apply();
  }, { passive:false });
  let drag = null;
  container.addEventListener('pointerdown', e=>{
    if (e.target.closest('.node') || e.target.closest('#panel') || e.target.closest('#errbox')) return;
    drag = { x:e.clientX, y:e.clientY, vx:st.x, vy:st.y };
    container.classList.add('panning'); container.setPointerCapture(e.pointerId);
  });
  container.addEventListener('pointermove', e=>{ if(!drag) return; st.x = drag.vx+e.clientX-drag.x; st.y = drag.vy+e.clientY-drag.y; apply(); });
  const up = ()=>{ drag=null; container.classList.remove('panning'); };
  container.addEventListener('pointerup', up); container.addEventListener('pointercancel', up);
  return { fit };
}

/* ── DOM refs ── */
const $ = s => document.querySelector(s);
const canvas = $('#canvas'), viewport = $('#viewport'), edgeg = $('#edgeg'), nodelayer = $('#nodelayer');
const panel = $('#panel'), legend = $('#legend'), warnbox = $('#warnbox');
const NS = 'http://www.w3.org/2000/svg';
const cam = makeCamera(canvas, viewport, WORLD);

/* ── State ── */
let mode = 'progress', impactOn = false;
const kindFilter = new Set(Object.keys(KIND));

/* ── Layout A: cây đứng top-down ── */
const SF_ORDER = M.nodes.filter(n=>n.kind==='sf').sort((a,b)=>(a.tier||0)-(b.tier||0)||a.id.localeCompare(b.id));
const sfX = i => 260 + i*350;
const SIZES = { epic:[300,58], sf:[232,58], task:[212,46], step:[204,44], area:[124,34], file:[236,38] };
function computeLayout(){
  const pos = new Map();
  pos.set('epic', { x:785, y:92, w:300, h:58 });
  SF_ORDER.forEach((sf,i)=>pos.set(sf.id, { x:sfX(i), y:260, w:232, h:58 }));
  SF_ORDER.forEach((sf,i)=>{
    if (mode==='progress'){
      children(sf.id).filter(n=>n.kind==='task').forEach((t,j)=>{
        pos.set(t.id, { x:sfX(i), y:404+j*62, w:212, h:46 });
      });
    } else {
      children(sf.id).filter(n=>n.kind==='step').forEach((s,j)=>{
        pos.set(s.id, { x:sfX(i), y:386+j*58, w:204, h:44 });
      });
      if (impactOn){
        const tg = impactTargets(sf.id).filter(n=>!pos.has(n.id));
        tg.forEach((n2,k)=>{
          const ang = tg.length===1 ? 0 : -52 + 104*(k/(tg.length-1)); /* fan hướng LÊN, tránh dãy step phía dưới */
          const rad = ang*Math.PI/180;
          const r = n2.kind==='area' ? 190 : 285;
          pos.set(n2.id, { x:sfX(i)+Math.sin(rad)*r, y:260-Math.cos(rad)*r, w:SIZES[n2.kind][0], h:SIZES[n2.kind][1] });
        });
      }
    }
  });
  return pos;
}
const impactTargets = sfId => (outEdges.get(sfId)||[]).filter(e=>e.rel==='impacts'||e.rel==='writes').map(e=>byId.get(e.to)).filter(Boolean);

/* ── Hidden rules + filter ── */
function nodeModeHidden(n){
  if (mode==='progress') return n.kind==='step'||n.kind==='area'||n.kind==='file';
  if (n.kind==='task') return true;
  if ((n.kind==='area'||n.kind==='file') && !impactOn) return true;
  return false;
}
function edgeModeHidden(e){
  if (mode==='progress') return e.rel==='flows-to'||e.rel==='impacts'||e.rel==='writes';
  return false;
}
function applyFilter(){
  const vis = new Set();
  nodelayer.querySelectorAll('.node').forEach(el=>{
    const n = byId.get(el.dataset.id);
    const hid = nodeModeHidden(n) || !kindFilter.has(n.kind);
    el.classList.toggle('hidden', hid);
    if (!hid) vis.add(n.id);
  });
  edgeg.querySelectorAll('.edge').forEach(el=>{
    const e = M.edges[+el.dataset.eid];
    el.classList.toggle('hidden', edgeModeHidden(e) || !vis.has(e.from) || !vis.has(e.to));
  });
}

/* ── Edge paths ── */
function faintCls(e){ return (mode==='logic' && (e.rel==='contains'||e.rel==='depends-on')) ? ' faint' : ''; }
function pathFor(e, pa, pb){
  if (e.rel==='contains'){
    const s = { x:pa.x, y:pa.y+pa.h/2 }, t = { x:pb.x, y:pb.y-pb.h/2-3 };
    const drop = e.from==='epic' ? 56 : 34;
    return 'M '+s.x+' '+s.y+' C '+s.x+' '+(s.y+drop)+', '+t.x+' '+(t.y-drop+4)+', '+t.x+' '+t.y;
  }
  if (e.rel==='depends-on'){
    const dir = pb.x>pa.x ? 1 : -1;
    const s = { x:pa.x+dir*pa.w/2, y:pa.y }, t = { x:pb.x-dir*(pb.w/2+3), y:pb.y };
    return 'M '+s.x+' '+s.y+' Q '+((s.x+t.x)/2)+' '+(Math.max(s.y,t.y)+82)+' '+t.x+' '+t.y;
  }
  if (e.rel==='flows-to'){
    const s = { x:pa.x, y:pa.y+pa.h/2 }, t = { x:pb.x, y:pb.y-pb.h/2-3 };
    return 'M '+s.x+' '+s.y+' C '+s.x+' '+(s.y+26)+', '+t.x+' '+(t.y-22)+', '+t.x+' '+t.y;
  }
  const dx = pb.x-pa.x, dy = pb.y-pa.y, L = Math.hypot(dx,dy)||1;
  const s = { x:pa.x+dx/L*pa.w/2, y:pa.y+dy/L*pa.h/2 };
  const t = { x:pb.x-dx/L*(pb.w/2+4), y:pb.y-dy/L*(pb.h/2+4) };
  return 'M '+s.x+' '+s.y+' L '+t.x+' '+t.y;
}
function drawEdges(pos){
  edgeg.innerHTML = '';
  M.edges.forEach((e,i)=>{
    const pa = pos.get(e.from), pb = pos.get(e.to);
    if (!pa || !pb) return;
    const p = document.createElementNS(NS,'path');
    p.setAttribute('class','edge e-'+e.rel+faintCls(e));
    p.dataset.eid = String(i);
    p.setAttribute('d', pathFor(e,pa,pb));
    if (e.rel==='depends-on'||e.rel==='flows-to') p.setAttribute('marker-end','url(#arr)');
    edgeg.appendChild(p);
  });
}

/* ── Node DOM — mọi text qua textContent (escape tự nhiên) ── */
function nodeEl(n, p){
  const el = document.createElement('div');
  el.className = 'node kind-'+n.kind + (n.kind==='file'&&n.computed ? ' computed' : '');
  el.dataset.id = n.id;
  el.style.left = (p.x-p.w/2)+'px'; el.style.top = (p.y-p.h/2)+'px';
  el.style.width = p.w+'px'; el.style.minHeight = p.h+'px';
  const row = document.createElement('div'); row.className = 'nrow';
  if (n.state){ const d = document.createElement('span'); d.className='dot'; d.style.background = STATE[n.state].color; row.append(d); }
  const tag = document.createElement('span'); tag.className='tag';
  tag.textContent = n.kind==='epic' ? 'EPIC' : n.kind==='sf' ? 'SF·T'+(n.tier??'?') : n.kind==='task' ? 'T' : n.kind==='step' ? 'S' : n.kind==='area' ? 'A' : 'F';
  row.append(tag);
  const t = document.createElement('span'); t.className='ntitle'; t.textContent = n.title; row.append(t);
  el.append(row);
  if (n.kind==='sf'){
    const tasks = children(n.id).filter(x=>x.kind==='task');
    const done = tasks.filter(x=>x.state==='done').length;
    const meta = document.createElement('div'); meta.className='nmeta';
    meta.textContent = (n.linear||'—') + ' · ' + done + '/' + tasks.length + ' task';
    el.append(meta);
    const bar = document.createElement('div'); bar.className='nbar';
    const fill = document.createElement('i'); fill.style.width = (tasks.length ? done/tasks.length*100 : 0)+'%';
    bar.append(fill); el.append(bar);
  }
  if (n.kind==='file'){
    const meta = document.createElement('div'); meta.className='nmeta'; meta.textContent = n.path;
    el.append(meta);
  }
  el.addEventListener('click', ev=>{ ev.stopPropagation(); select(n.id); });
  el.addEventListener('mouseenter', ()=>hoverSet(n.id));
  el.addEventListener('mouseleave', clearHover);
  return el;
}

/* ── Hover: dim + hàng xóm bậc 1 ── */
function hoverSet(id){
  const nb = neighbors(id); nb.add(id);
  nodelayer.querySelectorAll('.node').forEach(el=>el.classList.toggle('dim', !nb.has(el.dataset.id)));
  edgeg.querySelectorAll('.edge').forEach(el=>{
    const e = M.edges[+el.dataset.eid];
    const act = nb.has(e.from) && nb.has(e.to);
    el.classList.toggle('dim', !act);
    el.classList.toggle('hot', act && (e.from===id||e.to===id));
  });
}
function clearHover(){
  nodelayer.querySelectorAll('.node.dim').forEach(el=>el.classList.remove('dim'));
  edgeg.querySelectorAll('.edge').forEach(el=>el.classList.remove('dim','hot'));
}

/* ── Select + panel ── */
let selected = null;
function select(id){
  selected = id;
  nodelayer.querySelectorAll('.node').forEach(el=>el.classList.toggle('sel', el.dataset.id===id));
  openPanel(id);
}
function closePanel(){
  selected = null;
  nodelayer.querySelectorAll('.node.sel').forEach(el=>el.classList.remove('sel'));
  panel.classList.remove('show');
}
function el(cls, text){ const d = document.createElement('div'); d.className = cls; if (text!=null) d.textContent = text; return d; }
function openPanel(id){
  const n = byId.get(id);
  panel.innerHTML = '';
  const head = document.createElement('div'); head.className='p-head';
  head.append(el('p-kind', KIND[n.kind].label + (n.kind==='sf'&&n.tier!=null ? ' · tier '+n.tier : '')));
  const close = document.createElement('button'); close.className='p-close';
  close.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
  close.onclick = closePanel; head.append(close);
  panel.append(head, el('p-title', n.title));
  if (n.state){
    const st = STATE[n.state];
    const chip = document.createElement('span'); chip.className='p-state';
    chip.style.color = st.color;
    chip.style.borderColor = 'color-mix(in srgb,'+st.color+' 40%,transparent)';
    chip.style.background = 'color-mix(in srgb,'+st.color+' 10%,transparent)';
    chip.textContent = st.label;
    panel.append(chip);
  }
  const row = (k,v,mono)=>{ const r = el('p-row'); r.append(el('k',k)); const vv = el('v'+(mono?' mono':'')); vv.textContent = v; r.append(vv); panel.append(r); };
  if (n.linear) row('Linear', n.linear, true);
  if (n.kind==='epic') row('Nhánh đích', M.meta.dest, true);
  if (n.kind==='file'){
    row('Đường dẫn', n.path, true);
    row('Nguồn', n.computed ? 'story-impact (tính toán)' : 'Touch map (curated)');
    const sfs = sfWrites(n.id);
    if (sfs.length) row('SF đụng', sfs.map(s=>s.linear||s.title).join(', '));
  }
  if (n.kind==='step' && n.detail) row('Cơ chế', n.detail);
  const evs = evidenceFor(id);
  if (evs.length){
    panel.append(el('p-ev p-evh','Bằng chứng'));
    evs.forEach(ev=>{
      const item = el('p-evi', ev.summary);
      item.append(el('p-evr', ev.ref));
      panel.append(item);
    });
  }
  panel.classList.add('show');
}

/* ── Legend theo mode ── */
function refreshLegend(){
  legend.innerHTML = '';
  const add = c=>{ const d = document.createElement('div'); d.className='lg'+(c?' '+c:''); return d; };
  Object.entries(STATE).forEach(([k,st])=>{
    if (k==='complete') return;
    const d = add(); d.innerHTML = '<span class="dot" style="background:'+st.color+'"></span>'+st.label; legend.append(d);
  });
  const rels = mode==='progress' ? [['','contains'],['dash','depends-on']] : [['','flows-to'],['dotd','impacts'],['dash','writes']];
  rels.forEach(([c,label])=>{ const d = add(c); d.innerHTML = '<span class="lgsample"></span>'+label; legend.append(d); });
  if (mode==='logic' && impactOn){
    const d1 = add('dash'); d1.innerHTML = '<span class="lgsample"></span>file tính toán'; legend.append(d1);
    const d2 = add(); d2.innerHTML = '<span class="lgsample"></span>file curated'; legend.append(d2);
  }
}

/* ── Render ── */
function renderAll(fit){
  nodelayer.innerHTML = '';
  const pos = computeLayout();
  drawEdges(pos);
  M.nodes.forEach(n=>{ const p = pos.get(n.id); if (p) nodelayer.append(nodeEl(n,p)); });
  applyFilter(); refreshLegend();
  if (fit) cam.fit();
}

/* ── Toolbar ── */
const kindchips = $('#kindchips'), impactbtn = $('#impactbtn'), modeseg = $('#modeseg');
[['epic','Epic'],['sf','SF'],['task','Task'],['step','Bước'],['area','Area'],['file','File']].forEach(([k,label])=>{
  const b = document.createElement('button'); b.className='chip on'; b.dataset.kind=k; b.textContent=label;
  b.onclick = ()=>{ if (kindFilter.has(k)) kindFilter.delete(k); else kindFilter.add(k); b.classList.toggle('on',kindFilter.has(k)); applyFilter(); };
  kindchips.append(b);
});
function refreshChips(){
  kindchips.querySelectorAll('.chip').forEach(b=>{
    const k = b.dataset.kind;
    b.disabled = (mode==='progress' && (k==='step'||k==='area'||k==='file')) || (mode==='logic' && k==='task');
  });
  impactbtn.style.display = mode==='logic' ? '' : 'none';
}
modeseg.querySelectorAll('button').forEach(b=>{
  b.onclick = ()=>{
    mode = b.dataset.mode;
    if (mode==='progress') impactOn = false;
    modeseg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    impactbtn.classList.toggle('on', impactOn);
    refreshChips(); renderAll(true);
  };
});
impactbtn.onclick = ()=>{ impactOn = !impactOn; impactbtn.classList.toggle('on', impactOn); renderAll(true); };
$('#fitbtn').onclick = ()=>cam.fit();

/* ── Warnings (decodeWarnings[] — render phần còn lại + badge) ── */
$('#warncount').textContent = WARNINGS.length + ' cảnh báo decode';
WARNINGS.forEach(w=>{ const d = document.createElement('div'); d.textContent = w; warnbox.append(d); });
$('#warnchip').onclick = ()=>warnbox.classList.toggle('show');

/* ── Error state (payload lỗi từ main) ── */
const errbox = $('#errbox');
$('#errcode').textContent = 'error.code = ' + ERROR_PAYLOAD.code;
$('#errmsg').textContent = ERROR_PAYLOAD.message;
$('#errpath').textContent = ERROR_PAYLOAD.path;
$('#errbtn').onclick = ()=>errbox.classList.add('show');
$('#errclose').onclick = ()=>errbox.classList.remove('show');
errbox.addEventListener('click', e=>{ if (e.target===errbox) errbox.classList.remove('show'); });

/* ── Theme ── */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
const themeico = $('#themeico');
themeico.innerHTML = SUN;
$('#themebtn').onclick = ()=>{
  document.body.classList.toggle('light');
  themeico.innerHTML = document.body.classList.contains('light') ? MOON : SUN;
};

/* ── Nền canvas click → deselect ── */
canvas.addEventListener('click', e=>{ if (!e.target.closest('.node')) closePanel(); });

/* ── Meta + init ── */
$('#metaline').textContent = M.meta.generator + ' · ' + M.nodes.length + ' node · ' + M.edges.length + ' cạnh · sinh ' + M.meta.generatedAt.slice(0,16).replace('T',' ');
refreshChips();
renderAll(true);
window.addEventListener('resize', ()=>cam.fit());
</script>
</body>
</html>
